[workspace]
resolver = "2"
members = [
    "crates/pf-core",
    "crates/pf-store",
    "crates/pf-x11",
    "crates/pf-app",
    "crates/pf-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5"
blake3 = "1.8"
directories = "6.0"
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_14"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
regex = "1.11"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sourceview5 = "0.11"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
x11rb = { version = "0.14", features = ["xfixes", "xtest", "xkb"] }
zeroize = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
